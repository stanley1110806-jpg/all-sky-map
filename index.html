<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    </head>
<body>
    <div id="canvas-container"></div>
    
    <div id="star-label"><div class="label-content"><div class="label-name" id="l-name"></div><div class="label-coords" id="l-coords"></div></div></div>
    <div id="detail-panel">
        <div class="dp-drag-handle"></div><button id="dp-close">&times;</button>
        <div id="dp-type"></div><div id="dp-name"></div><div class="dp-divider"></div>
        <div class="dp-row"><span>赤經 RA</span><span id="dp-ra"></span></div>
        <div class="dp-row"><span>赤緯 Dec</span><span id="dp-dec"></span></div>
        <div class="dp-row" id="dp-mag-row"><span>視星等</span><span id="dp-mag"></span></div>
        <div id="dp-desc"></div>
    </div>

    <div id="ui-overlay">
        <header><h1>ALL-SKY 88</h1><p>全天 88 星座管理系統</p></header>
        <div id="bottom-controls">
            <div id="sub-menu"><div class="star-grid" id="star-btns"></div></div>
            <div id="const-menu"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 宣告全域變數，用來存放動態載入的資料
        let CONSTELLATIONS = [];
        const starEntries = [];
        const constGroups = [];
        const sphereRadius = 150;

        // --- 初始化 Three.js 環境 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 2, 5);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // (這裡省略天球網格、地球生成、貼圖生成等不變的核心底層函數...)
        function calculatePosition(ra, dec, radius) {
            const phi = (90 - dec) * (Math.PI / 180);
            const theta = (ra + 180) * (Math.PI / 180);
            return new THREE.Vector3(radius * Math.sin(phi) * Math.cos(theta), radius * Math.cos(phi), radius * Math.sin(phi) * Math.sin(theta));
        }
        function createStarTexture() { /* ...與前述相同... */ }
        const starTex = createStarTexture();

        // ==========================================
        //  關鍵改動：從外部 JSON 檔案讀取 88 個星座
        // ==========================================
        async function loadConstellationData() {
            try {
                // 發起請求讀取外部 JSON
                const response = await fetch('./constellations.json');
                CONSTELLATIONS = await response.json();
                
                // 資料載入成功後，才開始建構星空與 UI
                buildSkyMap();
                buildUIButtons();
            } catch (error) {
                console.error("無法載入全天星座資料檔，請檢查 JSON 路徑或格式。", error);
            }
        }

        function buildSkyMap() {
            CONSTELLATIONS.forEach((con, ci) => {
                const starMeshes = [];
                
                // 1. 生成該星座的星星
                con.stars.forEach((s, si) => {
                    const pos = calculatePosition(s.ra, s.dec, sphereRadius);
                    const size = Math.max(1.5, (5 - s.mag) * 1.2);
                    // 解析顏色字串 (如 "0xffcc88" 轉成 16 進位數字)
                    const colorHex = parseInt(s.color);
                    
                    const mat = new THREE.SpriteMaterial({ map: starTex, color: colorHex, transparent: true, blending: THREE.AdditiveBlending });
                    const obj = new THREE.Sprite(mat);
                    obj.position.copy(pos);
                    obj.scale.set(size, size, 1);
                    scene.add(obj);
                    
                    const entry = { mesh: obj, data: s, ci, si };
                    starEntries.push(entry);
                    starMeshes.push(entry);
                });

                // 2. 生成該星座的連線
                const linePoints = [];
                con.lines.forEach(([a, b]) => {
                    if(starMeshes[a] && starMeshes[b]) {
                        linePoints.push(starMeshes[a].mesh.position.clone(), starMeshes[b].mesh.position.clone());
                    }
                });
                const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
                const lineMat = new THREE.LineBasicMaterial({ color: 0x7aa2f7, transparent: true, opacity: 0 });
                const lineObj = new THREE.LineSegments(lineGeo, lineMat);
                scene.add(lineObj);
                constGroups.push(lineObj); // 存入陣列供後續互動控制
            });
        }

        function buildUIButtons() {
            const constMenu = document.getElementById('const-menu');
            CONSTELLATIONS.forEach((con, ci) => {
                const btn = document.createElement('button');
                btn.className = 'const-btn';
                btn.textContent = con.name;
                btn.onclick = () => toggleConst(ci);
                constMenu.appendChild(btn);
            });
        }

        // --- 啟動與動態循環 ---
        let activeCi = -1;
        function toggleConst(ci) {
            // (原本控制子選單與點亮連線的邏輯完全不用變)
            if(activeCi === ci) {
                activeCi = -1;
                constGroups.forEach(g => g.material.opacity = 0);
                document.getElementById('sub-menu').style.display = 'none';
                return;
            }
            activeCi = ci;
            constGroups.forEach((g, i) => g.material.opacity = (i === ci ? 0.6 : 0));
            // 更新下方選單星星按鈕... (同原本邏輯)
        }

        // 執行載入
        loadConstellationData();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
